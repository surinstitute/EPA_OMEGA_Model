[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epa-omega-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
	"numpy",
	"matplotlib",
	"pandas==1.4.4",
	"scipy",
	"treelib",
	"parquet==1.3.1",
	"fastparquet==0.8.3",
	"sphinx-rtd-theme>=1.0.0,<=2.0.0",
	"dispy==4.15.2",
	"pycos==4.12.2",
	"psutil",
	"netifaces; platform_system != 'Windows' or python_version <= '3.8'",
	"pyDOE2",
	"openpyxl",
	"PySide6",
	"multitimer",
	"PyYAML",
]

[project.optional-dependencies]
dev = [
	"Sphinx<4.0.0",
	"jinja2==2.11.3",
	"markupsafe==2.0.1",
	"bumpversion",
	"pyinstaller",
	"snakeviz",
	"twine",
]

[tool.setuptools]
py-modules = ["usepa_omega2"]

[tool.setuptools.packages.find]
include = ["omega_model*", "omega_effects*", "omega_preproc*", "omega_gui*"]
